services:
  firewall:
    build:
      context: .
      dockerfile: Dockerfile.firewall
    container_name: firewall-gateway
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      lan_net:
        ipv4_address: 172.20.0.2
      dmz_net:
        ipv4_address: 172.30.0.2
  firebird-db:
    image: williandoamor/firebird2.5-sc@sha256:434554e0c7c7026ab6e3cf66f8fe4da2e2496061cc4ffbcb97a4605205b05172
    container_name: firebird-db
    networks:
      dmz_net:
        ipv4_address: 172.30.0.100
  dev-workstation:
    build:
      context: .
      dockerfile: Dockerfile.workstation
    container_name: dev-workstation
    command: >
      sh -c "ip route del default &&
             ip route add default via 172.20.0.2 &&
             tail -f /dev/null"
    cap_add:
      - NET_ADMIN
    networks:
      lan_net:
        ipv4_address: 172.20.0.10
  mixed-workstation:
    build:
      context: .
      dockerfile: Dockerfile.workstation
    container_name: mixed-workstation
    command: >
      sh -c "ip route del default &&
             ip route add default via 172.20.0.2 &&
             tail -f /dev/null"
    cap_add:
      - NET_ADMIN
    networks:
      lan_net:
        ipv4_address: 172.20.0.20

networks:
  lan_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16